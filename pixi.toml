[workspace]
authors = ["jgsimard <jeangab23@gmail.com>"]
channels = ["https://conda.modular.com/max-nightly", "conda-forge"]
name = "moregex"
platforms = ["linux-64"]
version = "0.1.1"
preview = ["pixi-build"]

[package]
name = "moregex"
version = "0.1.1"

[package.build]
backend = { name = "pixi-build-rattler-build", version = ">=0.3.13" }

[feature.dev.tasks]
test = "bash scripts/run_tests.sh"
fmt = "mojo format moregex test"

[dependencies]
mojo = "=1.2.0"

[environments]
default = { solve-group = "default" }
dev = { features = ["dev"], solve-group = "default" }
