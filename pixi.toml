[workspace]
authors = ["jgsimard <jeangab23@gmail.com>"]
channels = ["https://conda.modular.com/max-nightly", "conda-forge"]
name = "moregex"
platforms = ["linux-64"]
version = "0.1.1"
preview = ["pixi-build"]

[package]
name = "moregex"
version = "0.1.1"

[package.build]
backend = { name = "pixi-build-rattler-build", version = ">=0.3.13" }

[feature.dev.tasks]
test = "bash scripts/run_tests.sh"
fmt = "mojo format moregex test"

[dependencies]
mojo = { version = ">=1.3.0.dev2026111805,<2", channel = "https://conda.modular.com/max-nightly" }
# Explicit channels work around Pixi 0.79 channel-priority errors for these dependencies.
mojo-compiler = { version = ">=1.3.0.dev2026111805,<2", channel = "https://conda.modular.com/max-nightly" }
mojo-python = { version = ">=1.3.0.dev2026111805,<2", channel = "https://conda.modular.com/max-nightly" }
mblack = { version = ">=26.8.0.dev2026111805,<27", channel = "https://conda.modular.com/max-nightly" }

[environments]
default = { solve-group = "default" }
dev = { features = ["dev"], solve-group = "default" }
