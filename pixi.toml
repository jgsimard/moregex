[workspace]
authors = ["jgsimard <jeangab23@gmail.com>"]
channels = ["https://conda.modular.com/max-nightly", "conda-forge"]
name = "moregex"
platforms = ["linux-64"]
version = "0.1.0"

[feature.dev.tasks]
test = "bash scripts/run_tests.sh"
fmt = "mojo format moregex test"
check = { depends-on = ["fmt-check", "test"] }

[dependencies]
mojo = ">=1.3.0.dev2026102505,<2"

[environments]
default = { solve-group = "default" }
dev = { features = ["dev"], solve-group = "default" }
